base-folder = "./data"

database.url = "jdbc:h2:"${base-folder}"/db/pi-farm;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"

udp-server {
  port = 9090
  port = ${?UDP_PORT}
  ip = "0.0.0.0"
  ip = ${?UDP_IP}
  queue-size = 16
  num-threads = 2
  num-threads = ${?UDP_NUM_THREADS}
}

http-server {
  port = 9000
  port = ${?HTTP_PORT}
  address = "0.0.0.0"
  address = ${?HTTP_ADDRESS}
  num-threads = 4
  num-threads = ${?HTTP_NUM_THREADS}
}

file-service {
  base-dir = ${base-folder}"/static/"
  code-dir = "code"
  image-dir = "images"
  staging-dir = "/tmp/staging"
  code-file-globs = ["platformio.ini", "**/*.c", "**/*.cpp", "**/*.h", "**/*.hpp", "**/*.ino"]
  max-code-files = 100
  max-code-file-size = 5242880 # 5 MiB
}

firmware {
  wifi-ssid = ""
  wifi-ssid = ${?WIFI_SSID}
  wifi-password = ""
  wifi-password = ${?WIFI_PASSWORD}
  timeout = 20 minutes
  timeout = ${?FIRMWARE_TIMEOUT}
}