; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:default]
platform = espressif32@^8.0.0
board = freenove_esp32_s3_wroom
framework = arduino
; CRITICAL: Fixes the blank monitor issue on ESP32-S3 v8.0+
monitor_speed = 115200

lib_deps = 
	beegee-tokyo/DHT sensor library for ESPx@^1.19
	bblanchon/ArduinoJson@^7.2.2
build_flags = 
    -DSERIAL_SPEED=115200
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    
    ;-DCORE_DEBUG_LEVEL=3

; 1. Explicitly flash and memory controller maps for v8
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
; CRUCIAL: Prevent PlatformIO from locking the S3 hardware state
monitor_dtr = 0
monitor_rts = 0
; extra_scripts = pre:scripts/wifi_credentials.py
